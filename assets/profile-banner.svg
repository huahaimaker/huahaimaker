<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">花海 / FlowerOcean</title>
  <desc id="desc">Practical AI products, open-source tools, and creator workflows.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#0b2032"/>
      <stop offset="1" stop-color="#102a3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8dd7f7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1010" cy="162" r="265" fill="url(#glow)"/>

    <path d="M735 292C815 216 871 283 944 214C1014 148 1072 230 1241 94" fill="none" stroke="#60a5fa" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M702 333C806 235 895 338 975 250C1050 168 1139 239 1236 145" fill="none" stroke="#5eead4" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M792 240C872 176 912 231 985 166C1052 107 1123 151 1222 58" fill="none" stroke="#c084fc" stroke-opacity="0.18" stroke-width="2"/>

    <g transform="translate(1000 168)">
      <circle r="105" fill="none" stroke="#7dd3fc" stroke-opacity="0.12" stroke-width="1"/>
      <circle r="72" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="1"/>
      <circle r="42" fill="none" stroke="#7dd3fc" stroke-opacity="0.28" stroke-width="1.5"/>
      <circle r="14" fill="#5eead4" fill-opacity="0.18" stroke="#5eead4" stroke-width="1.5"/>
      <circle r="5" fill="#a5f3fc" filter="url(#softGlow)"/>
      <circle r="5" fill="#a5f3fc"/>
      <circle cx="-84" cy="-62" r="4" fill="#60a5fa"/>
      <circle cx="93" cy="27" r="4" fill="#c084fc"/>
      <circle cx="-49" cy="91" r="3" fill="#5eead4"/>
    </g>

    <rect x="70" y="58" width="94" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="139" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="61" font-weight="720" letter-spacing="-1.5">花海 / FlowerOcean</text>
    <text x="72" y="190" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="460" letter-spacing="0.4">把 AI 想法做成真实、可下载、可复用的产品</text>
    <text x="72" y="226" fill="#91a7b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="0.55">Practical AI products · Open-source tools · Creator workflows</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650" letter-spacing="1.15">
      <rect x="70" y="270" width="133" height="36" rx="18" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.42"/>
      <text x="136.5" y="293" fill="#99f6e4" text-anchor="middle">AI PRODUCTS</text>
      <rect x="216" y="270" width="137" height="36" rx="18" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.42"/>
      <text x="284.5" y="293" fill="#bfdbfe" text-anchor="middle">OPEN SOURCE</text>
      <rect x="366" y="270" width="157" height="36" rx="18" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-opacity="0.42"/>
      <text x="444.5" y="293" fill="#e9d5ff" text-anchor="middle">CREATOR TOOLS</text>
    </g>
  </g>
</svg>
